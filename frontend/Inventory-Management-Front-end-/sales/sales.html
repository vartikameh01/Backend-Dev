<!DOCTYPE html>
<html>
<head>
    <title>Sales</title>
    <link rel="stylesheet" href="./sales.css">
</head>
<body>
    

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>InvenTrack</h2>
        <ul>
    <li onclick="location.href='/dashboard/dashboard.html'">Dashboard</li>
    <li onclick="location.href='/product/product.html'">Products</li>
    <li class="active">Sales</li>
    <li onclick="location.href='/purchase/purchase.html'">Purchases</li>
    <li onclick="location.href='/users/Users.html'">Users</li>
</ul>

        <ul class="bottom-menu">
            <li onclick="location.href='/setting/setting.html'">Settings</li>
            <li onclick="logoutUser()">Logout</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="header">
            <h1>Sales & Purchases</h1>
            <button onclick="openForm()">+ New Sale</button>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>Invoice</th>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="salesTable"></tbody>
        </table>

    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="form">
        <h2>Add Sale</h2>

        <select id="product">
            <option value="">Select Product</option>
        </select>
        <input type="number" id="quantity" placeholder="Quantity">
        <input type="number" id="price" placeholder="Price">

        <button onclick="addSale()">Save</button>
        <button onclick="closeForm()">Cancel</button>
    </div>
</div>
<script>
// auth check
// if(!localStorage.getItem("token")){
//     location.href = "/logging/logging.html";
// }
function logoutUser(){
    localStorage.removeItem("token");
    localStorage.removeItem("userName");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");
    location.href = "/logging/logging.html";
}
</script>
<script src="./sales.js"></script>
</body>
</html>
