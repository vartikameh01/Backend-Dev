<!DOCTYPE html>
<html>
<head>
    <title>Purchases</title>
    <link rel="stylesheet" href="./purchase.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h2>InvenTrack</h2>
        <ul>
    <li onclick="location.href='/dashboard/dashboard.html'">Dashboard</li>
    <li onclick="location.href='/product/product.html'">Products</li>
    <li onclick="location.href='/sales/sales.html'">Sales</li>
    <li class="active">Purchases</li>
    <li onclick="location.href='/users/Users.html'">Users</li>
</ul>

        <ul class="bottom-menu">
            <li  onclick="location.href='/setting/setting.html'">Settings</li>
            <li onclick="logoutUser()">Logout</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="header">
            <h1>Purchases</h1>
            <button onclick="openForm()">+ Add Purchase</button>
        </div>

        <!-- Search -->
        <input type="text" id="search" placeholder="Search purchases..." onkeyup="searchPurchase()">

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>DATE</th>
                    <th>PRODUCT</th>
                    <th>QUANTITY</th>
                    <th>PRICE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="purchaseTable"></tbody>
        </table>

    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="form">
        <h2>Add Purchase</h2>

        <select id="product">
            <option value="">Select Product</option>
        </select>
        <input type="number" id="quantity" placeholder="Quantity">
        <input type="number" id="price" placeholder="Price">
        <button type="button" onclick="addPurchase()">Save</button>
       <button type="button" onclick="closeForm()">Cancel</button>
    </div>
</div>

<script>
// auth check
// if(!localStorage.getItem("token")){
//     location.href = "/logging/logging.html";
// }
function logoutUser(){
    localStorage.removeItem("token");
    localStorage.removeItem("userName");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");
    location.href = "/logging/logging.html";
}
</script>
<script src="./purchase.js"></script>
</body>
</html>
